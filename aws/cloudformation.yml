# GENERATED by scripts/aws/render-cloudformation.mjs from aws/cloudformation.template.yml.
# Do not edit by hand: change the template, url-rewrite.js or content-security-policy.txt and re-run.
AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Visa2Grow website: private S3 bucket + CloudFront (clean URLs, security headers,
  404 page), the /api/inquiry Lambda (Resend email), optional WAF rate limiting
  and an optional GitHub Actions deploy role (OIDC). Deploy in us-east-1.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Domain }
        Parameters: [DomainNames, CanonicalHost, CertificateArn, PriceClass]
      - Label: { default: Inquiry emails }
        Parameters: [InquiryNotificationEmail, InquiryFromEmail, ResendApiKeyParameterName]
      - Label: { default: Protection }
        Parameters: [EnableWafRateLimit, WafRateLimitPer5Min]
      - Label: { default: CI/CD }
        Parameters: [GitHubRepository, GitHubBranch, GitHubOidcSubjectPrefix, CreateGitHubOidcProvider]

Parameters:
  DomainNames:
    Type: CommaDelimitedList
    Default: ''
    Description: >-
      Custom domains served by CloudFront, e.g. "www.visa2grow.com" (the bare domain is
      forwarded to www by GoDaddy). Leave empty to use the *.cloudfront.net address only.
  CanonicalHost:
    Type: String
    Default: www.visa2grow.com
    AllowedPattern: '^$|^[a-z0-9.-]+$'
    Description: >-
      The one host every other custom domain redirects to, e.g. "visa2grow.com"
      (or "www.visa2grow.com" if your DNS can only CNAME the www name). Empty = no redirect.
  CertificateArn:
    Type: String
    Default: ''
    Description: ACM certificate in us-east-1 covering every name in DomainNames. Required when DomainNames is set.
  PriceClass:
    Type: String
    Default: PriceClass_200
    AllowedValues: [PriceClass_100, PriceClass_200, PriceClass_All]
    Description: PriceClass_200 includes edge locations in India.
  InquiryNotificationEmail:
    Type: String
    Default: sales@visa2grow.com
  InquiryFromEmail:
    Type: String
    Default: Visa2Grow Website <inquiries@visa2grow.com>
    Description: Must be on a domain verified in Resend.
  ResendApiKeyParameterName:
    Type: String
    Default: /visa2grow/resend-api-key
    AllowedPattern: '^/[A-Za-z0-9/_.-]+$'
    Description: SSM Parameter Store SecureString holding the Resend API key (create it before deploying).
  EnableWafRateLimit:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Adds an AWS WAF web ACL that rate-limits POST /api/inquiry per IP (about US$6/month).
  WafRateLimitPer5Min:
    Type: Number
    Default: 20
    MinValue: 10
    Description: Max inquiry requests per IP per 5 minutes before WAF blocks.
  GitHubRepository:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'
    Description: owner/repo allowed to deploy via GitHub Actions OIDC. Leave empty to skip the deploy role.
  GitHubBranch:
    Type: String
    Default: master
  GitHubOidcSubjectPrefix:
    Type: String
    Default: ''
    Description: >-
      The repo's OIDC subject prefix if GitHub uses immutable subjects, e.g.
      "repo:owner@123/repo@456" (gh api repos/OWNER/REPO/actions/oidc/customization/sub).
      Empty = "repo:<GitHubRepository>". scripts/aws/deploy-infra.sh fills this in automatically.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if this AWS account already has the token.actions.githubusercontent.com OIDC provider.

Rules:
  MustBeUsEast1:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', us-east-1]
        AssertDescription: Deploy this stack in us-east-1 (CloudFront certificates and WAF for CloudFront live there).
  CertificateWithDomains:
    # Rules only allow a few functions (no !Join), hence EachMemberEquals.
    RuleCondition: !Not [!EachMemberEquals [!Ref DomainNames, '']]
    Assertions:
      - Assert: !Not [!Equals [!Ref CertificateArn, '']]
        AssertDescription: CertificateArn is required when DomainNames is set.

Conditions:
  HasDomain: !Not [!Equals [!Join ['', !Ref DomainNames], '']]
  HasCanonicalHost: !Not [!Equals [!Ref CanonicalHost, '']]
  HasWaf: !Equals [!Ref EnableWafRateLimit, 'true']
  HasGitHub: !Not [!Equals [!Ref GitHubRepository, '']]
  CreateOidcProvider: !And [!Condition HasGitHub, !Equals [!Ref CreateGitHubOidcProvider, 'true']]
  HasSubjectPrefix: !Not [!Equals [!Ref GitHubOidcSubjectPrefix, '']]

Resources:
  # ---------------------------------------------------------------- storage
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      VersioningConfiguration: { Status: Enabled }
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: CloudFrontReadOnly
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub '${SiteBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          # ListBucket makes S3 answer 404 (not 403) for missing pages, so only
          # real 404s get the custom 404 page; /api errors pass through untouched.
          - Sid: CloudFrontList
            Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:ListBucket
            Resource: !GetAtt SiteBucket.Arn
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource: [!GetAtt SiteBucket.Arn, !Sub '${SiteBucket.Arn}/*']
            Condition: { Bool: { aws:SecureTransport: 'false' } }

  # ---------------------------------------------------------------- inquiry Lambda
  InquiryFunctionLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-inquiry'
      RetentionInDays: 30

  InquiryFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: inquiry
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt InquiryFunctionLogs.Arn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter${ResendApiKeyParameterName}'

  InquiryFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-inquiry'
      Description: POST /api/inquiry - validates project inquiries and emails them via Resend.
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt InquiryFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref InquiryFunctionLogs
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
          RESEND_API_KEY_PARAM: !Ref ResendApiKeyParameterName
          INQUIRY_NOTIFICATION_EMAIL: !Ref InquiryNotificationEmail
          INQUIRY_FROM_EMAIL: !Ref InquiryFromEmail
          SITE_URL: !If [HasCanonicalHost, !Sub 'https://${CanonicalHost}', 'https://www.visa2grow.com']
          # Unguessable value only CloudFront knows; direct calls to the function URL are refused.
          ORIGIN_VERIFY_SECRET: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
      Code:
        # Placeholder until the first pipeline run uploads the real bundle.
        ZipFile: |
          exports.handler = async () => ({
            statusCode: 503,
            headers: { 'content-type': 'application/json' },
            body: '{"ok":false,"error":"not_configured"}',
          });

  InquiryFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt InquiryFunction.Arn
      AuthType: NONE

  InquiryFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InquiryFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  InquiryFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref InquiryFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

  # ---------------------------------------------------------------- CloudFront
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-site'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  UrlRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-url-rewrite'
      AutoPublish: true
      FunctionConfig:
        Comment: Clean URLs, trailing-slash and www redirects
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
          // BEGIN url-rewrite (CloudFront Functions, cloudfront-js-2.0, viewer-request)
          // Maps clean URLs onto the prerendered files in S3 and enforces one canonical
          // form per page. Kept in sync with aws/cloudformation.yml by a unit test.
          // CANONICAL_HOST is filled in by CloudFormation (!Sub) from the CanonicalHost
          // parameter; empty means "no host redirect".
          //   other custom host           -> 301 https://CANONICAL_HOST/x  (*.cloudfront.net is left alone for testing)
          //   /about/                     -> 301 /about
          //   /about.html, /index.html    -> 301 /about, /
          //   /                           -> serves /index.html
          //   /about                      -> serves /about.html
          //   /assets/app.js              -> unchanged (has a file extension)
          var CANONICAL_HOST = '${CanonicalHost}';

          function handler(event) {
            var request = event.request;
            var uri = request.uri;
            var host = request.headers.host ? request.headers.host.value : '';
            var qs = queryString(request.querystring);

            if (CANONICAL_HOST && host && host !== CANONICAL_HOST && !/\.cloudfront\.net$/.test(host)) {
              return redirect('https://' + CANONICAL_HOST + uri + qs);
            }
            if (uri.length > 1 && uri.charAt(uri.length - 1) === '/') {
              return redirect(uri.replace(/\/+$/, '') + qs);
            }
            if (uri === '/index.html') {
              return redirect('/' + qs);
            }
            if (uri.length > 5 && uri.substring(uri.length - 5) === '.html' && uri !== '/404.html') {
              return redirect(uri.substring(0, uri.length - 5) + qs);
            }
            if (uri === '/') {
              request.uri = '/index.html';
            } else if (uri.lastIndexOf('.') < uri.lastIndexOf('/')) {
              request.uri = uri + '.html';
            }
            return request;
          }

          function queryString(q) {
            var parts = [];
            for (var key in q) {
              var entry = q[key];
              var values = entry.multiValue ? entry.multiValue : [entry];
              for (var i = 0; i < values.length; i++) {
                parts.push(values[i].value === '' ? key : key + '=' + values[i].value);
              }
            }
            return parts.length ? '?' + parts.join('&') : '';
          }

          function redirect(location) {
            return {
              statusCode: 301,
              statusDescription: 'Moved Permanently',
              headers: { location: { value: location }, 'cache-control': { value: 'max-age=3600' } },
            };
          }
          // END url-rewrite

  ApiViewerHostFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub '${AWS::StackName}-api-viewer-host'
      AutoPublish: true
      FunctionConfig:
        Comment: Passes the site host to the inquiry Lambda for its same-origin check
        Runtime: cloudfront-js-2.0
      FunctionCode: |
          function handler(event) {
            var request = event.request;
            request.headers['x-viewer-host'] = { value: request.headers.host ? request.headers.host.value : '' };
            return request;
          }

  SecurityHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub '${AWS::StackName}-security-headers'
        SecurityHeadersConfig:
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
          ContentTypeOptions: { Override: true }
          FrameOptions: { FrameOption: DENY, Override: true }
          ReferrerPolicy: { ReferrerPolicy: strict-origin-when-cross-origin, Override: true }
          ContentSecurityPolicy:
            # Kept in sync with scripts/serve.mjs, where the e2e tests exercise it.
            ContentSecurityPolicy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests"
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: camera=(), microphone=(), geolocation=(), interest-cohort=()
              Override: true

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub '${AWS::StackName} website'
        Enabled: true
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: !Ref PriceClass
        Aliases: !If [HasDomain, !Ref DomainNames, !Ref 'AWS::NoValue']
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        WebACLId: !If [HasWaf, !GetAtt WebAcl.Arn, !Ref 'AWS::NoValue']
        DefaultRootObject: index.html
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: '' }
          - Id: inquiry-api
            # https://<id>.lambda-url.<region>.on.aws/ -> <id>.lambda-url.<region>.on.aws
            DomainName: !Select [2, !Split ['/', !GetAtt InquiryFunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Select [2, !Split ['/', !Ref 'AWS::StackId']]
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UrlRewriteFunction.FunctionMetadata.FunctionARN
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: inquiry-api
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
            CachedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader
            ResponseHeadersPolicyId: !Ref SecurityHeadersPolicy
            FunctionAssociations:
              - EventType: viewer-request
                FunctionARN: !GetAtt ApiViewerHostFunction.FunctionMetadata.FunctionARN
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 60

  # ---------------------------------------------------------------- optional WAF
  WebAcl:
    Type: AWS::WAFv2::WebACL
    Condition: HasWaf
    Properties:
      Name: !Sub '${AWS::StackName}-web-acl'
      Scope: CLOUDFRONT
      DefaultAction: { Allow: {} }
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub '${AWS::StackName}-web-acl'
      Rules:
        - Name: inquiry-rate-limit
          Priority: 0
          Action: { Block: {} }
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: inquiry-rate-limit
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimitPer5Min
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: { UriPath: {} }
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/
                  TextTransformations: [{ Priority: 0, Type: NONE }]

  # ---------------------------------------------------------------- optional GitHub OIDC deploy role
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  GitHubDeployRole:
    Type: AWS::IAM::Role
    Condition: HasGitHub
    Properties:
      Description: Assumed by GitHub Actions to deploy the Visa2Grow website.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Jobs that use a GitHub environment present "environment:<name>" instead of the
                # branch ref. The production environment itself is restricted to GitHubBranch.
                token.actions.githubusercontent.com:sub:
                  - !Sub
                    - '${Prefix}:environment:production'
                    - Prefix: !If [HasSubjectPrefix, !Ref GitHubOidcSubjectPrefix, !Sub 'repo:${GitHubRepository}']
                  - !Sub
                    - '${Prefix}:ref:refs/heads/${GitHubBranch}'
                    - Prefix: !If [HasSubjectPrefix, !Ref GitHubOidcSubjectPrefix, !Sub 'repo:${GitHubRepository}']
      Policies:
        - PolicyName: deploy-site
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: Bucket
                Effect: Allow
                Action: [s3:ListBucket]
                Resource: !GetAtt SiteBucket.Arn
              - Sid: Objects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource: !Sub '${SiteBucket.Arn}/*'
              - Sid: Invalidate
                Effect: Allow
                Action: [cloudfront:CreateInvalidation, cloudfront:GetInvalidation]
                Resource: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}'
              - Sid: Lambda
                Effect: Allow
                Action: [lambda:UpdateFunctionCode, lambda:GetFunction, lambda:GetFunctionConfiguration]
                Resource: !GetAtt InquiryFunction.Arn
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Ref 'AWS::StackId'

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  DistributionId:
    Value: !Ref Distribution
  DistributionDomainName:
    Description: Point your DNS here (CNAME / ALIAS).
    Value: !GetAtt Distribution.DomainName
  InquiryFunctionName:
    Value: !Ref InquiryFunction
  GitHubDeployRoleArn:
    Condition: HasGitHub
    Description: Put this in the AWS_DEPLOY_ROLE_ARN GitHub secret.
    Value: !GetAtt GitHubDeployRole.Arn
